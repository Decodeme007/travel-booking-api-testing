name: Travel Booking API Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  api-regression-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed Database
      run: |
        python -m app.seed_data

    - name: Run Pytest API Test Suite & Generate HTML Report
      run: |
        python -m pytest tests/ -v --html=reports/test_report.html --self-contained-html
        cp reports/test_report.html reports/index.html

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-test-report
        path: |
          reports/test_report.html
          reports/logs/test_execution.log
        retention-days: 14

    - name: Deploy Live Test Report to GitHub Pages
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./reports
        publish_branch: gh-pages
